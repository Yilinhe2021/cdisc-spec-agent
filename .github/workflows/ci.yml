name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env: { SPECFORGE_LLM: mock }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - run: ruff check backend --select E,F,W --ignore E501
      - run: python examples/make_examples.py
      - run: cd backend && pytest -q
      - run: python eval/run_eval.py --mutations 40
      - name: no real data in repo
        run: |
          ! git ls-files | grep -Ei '\.(sas7bdat|xpt)$'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm install && npm run build
