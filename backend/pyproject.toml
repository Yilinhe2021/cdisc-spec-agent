[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
version = "0.1.0"
description = "Multi-agent + RAG QC and dataset generation for CDISC SDTM/ADaM specifications"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeffrey Longan" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pandas>=2.1",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pydantic>=2.6",
]

[project.urls]
Repository = "https://github.com/Yilinhe2021/cdisc-spec-agent"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
embeddings = ["sentence-transformers>=3.0"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
specforge = "specforge.cli:main"

[tool.setuptools.packages.find]
include = ["specforge*"]

[tool.setuptools.package-data]
specforge = ["rag/knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
